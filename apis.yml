description: 'MediSage is an India-based digital health company that operates one of
  Asia''s largest online medical communities, connecting doctors and healthcare practitioners
  with first-hand, peer-reviewed medical information, live CME webinars, clinical discussion
  forums, medical news, and professional networking. Backed by Bessemer Venture Partners,
  MediSage delivers its knowledge platform primarily through consumer-facing web and
  mobile applications for physicians; no public developer API, OpenAPI specification,
  or partner integration surface has been identified at this time.'
